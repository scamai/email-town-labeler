name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ -x "$RUNNER_TEMP/wheelenv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/wheelenv/Scripts/python.exe"
            BIN="$RUNNER_TEMP/wheelenv/Scripts"
          else
            PY="$RUNNER_TEMP/wheelenv/bin/python"
            BIN="$RUNNER_TEMP/wheelenv/bin"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          # Run from outside the checkout so the installed package, not ./src, is imported.
          cd "$RUNNER_TEMP"
          "$BIN/email-town-labeler" --version
          "$BIN/email-town-labeler" --help

      - name: Check sdist contents
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          tar -tzf dist/*.tar.gz > sdist.txt
          if grep -E '(client_secret|token)[^/]*\.json$|\.sqlite' sdist.txt; then
            echo "credentials or state found in sdist" >&2; exit 1
          fi
          grep -q 'src/email_town_labeler/__init__.py' sdist.txt

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (core)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: email-town-labeler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm email-town-labeler:ci --version
          docker run --rm email-town-labeler:ci --help
          test "$(docker run --rm --entrypoint id email-town-labeler:ci -u)" != "0"
