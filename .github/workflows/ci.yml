name: CI

# The test matrix runs at least once per change, on the tree that lands: the push run on main. A pull
# request's run tests it too, unless the PR is already merged when that run's first job reads its state
# (most PRs here merge seconds after they open). So a change is usually tested once and at most twice,
# instead of always twice, side by side.
#
# macOS runs on our own Mac (job test-macos), never on a GitHub-hosted runner, and only on main: a push to
# main or a manual run from main. A pull request runs Linux and Windows; a macOS break shows on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every run on main (push, workflow_dispatch) has a
  # group of its own and is never cancelled, so each merged tree gets a result.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-state:
    name: pull request state
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.state.outputs.merged }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # an API error reads as "not merged", so the tests run as they would without this job
          merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .merged) || {
            echo "::warning::could not read the state of #$PR; running the tests"
            merged=false
          }
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          if [ "$merged" = true ]; then
            echo "::notice::#$PR is already merged: the push run on main tests the tree that landed, so the tests are skipped here"
          fi

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: pr-state
    # runs on push and workflow_dispatch (pr-state skipped) and on an unmerged pull request
    if: ${{ !cancelled() && needs.pr-state.outputs.merged != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # every lane reports: a Windows failure must not hide what Linux says about the same commit
      fail-fast: false
      matrix:
        # Linux runs every Python in pyproject's classifiers. macOS (job test-macos) and Windows run two: 3.10,
        # the oldest the README promises on every system, and 3.12, the interpreter app.yml bundles into the
        # desktop app (`uv venv --python 3.12`). Their lanes test platform code (service.py, lock.py, paths, file
        # modes, encodings). In the 26 failed runs whose jobs were read (Oct 23-Nov 21), every macOS or Windows
        # test failure failed all of that system's Python lanes; the one single-lane failure was a setup-python
        # download.
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # test-macos repeats the steps marked &name below (*name), so both jobs run the same commands.
      - &install
        name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - &lint
        name: Lint
        run: ruff check .

      - &format
        name: Format
        run: ruff format --check .

      - &pytest
        name: Test
        run: python -m pytest

      - &build
        name: Build sdist and wheel
        run: python -m build

      - &smoke-wheel
        name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ -x "$RUNNER_TEMP/wheelenv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/wheelenv/Scripts/python.exe"
            BIN="$RUNNER_TEMP/wheelenv/Scripts"
          else
            PY="$RUNNER_TEMP/wheelenv/bin/python"
            BIN="$RUNNER_TEMP/wheelenv/bin"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          # Run from outside the checkout so the installed package, not ./src, is imported.
          cd "$RUNNER_TEMP"
          "$BIN/email-town-labeler" --version
          "$BIN/email-town-labeler" --help

      - name: Check sdist contents
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          tar -tzf dist/*.tar.gz > sdist.txt
          if grep -E '(client_secret|token)[^/]*\.json$|\.sqlite' sdist.txt; then
            echo "credentials or state found in sdist" >&2; exit 1
          fi
          grep -q 'src/email_town_labeler/__init__.py' sdist.txt

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/
          retention-days: 7

  # macOS runs on our own Mac (macserver), never on a GitHub-hosted runner (owner, 2026-11-21). Its runner group
  # admits this file only as it is on refs/heads/main, so these lanes run on a push to main and on a manual run
  # from main, never on a pull request: code from a fork must never run on it. A pull request that edits the
  # condition below still cannot reach the Mac, because its run reads this file at refs/pull/N/merge, which the
  # group does not admit. One job at a time runs on the Mac, so the two lanes take turns.
  test-macos:
    name: test (macOS, py${{ matrix.python }})
    if: >-
      github.repository == 'scamai/email-town-labeler' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, macserver-public]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # setup-python cannot install on a self-hosted Mac without admin rights (its macOS builds must live in
      # /Users/runner/hostedtoolcache); uv's managed CPython installs in the runner user's home instead.
      - uses: astral-sh/setup-uv@v6

      - name: Python ${{ matrix.python }} (uv-managed, first on PATH)
        run: |
          uv venv --seed --python-preference only-managed --python "${{ matrix.python }}" "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - *install
      - *lint
      - *format
      - *pytest
      - *build
      - *smoke-wheel

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (core)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: email-town-labeler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm email-town-labeler:ci --version
          docker run --rm email-town-labeler:ci --help
          test "$(docker run --rm --entrypoint id email-town-labeler:ci -u)" != "0"
