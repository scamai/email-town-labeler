name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python -m pip install --upgrade pip build
          PKG_VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/email_town_labeler/__init__.py').read_text()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          test "$PKG_VERSION" = "$TAG_VERSION"
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The PyPI name is TBD: "email-town-labeler" on PyPI belongs to an unrelated project. Until the final
  # name is decided and the pyproject `name` matches it, this job stays off. Turn it on with the
  # repository variable PYPI_PUBLISH = 'true' (Settings > Secrets and variables > Actions > Variables).
  # GHCR images and the GitHub release are published either way.
  pypi:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/email-town-labeler
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    name: publish image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - extras: ""
            suffix: ""
          - extras: "embed"
            suffix: "-embed"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: EXTRAS=${{ matrix.extras }}
          # The CPU torch image is amd64/arm64 only; both have wheels on the PyTorch CPU index.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'core' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'core' }}

  github-release:
    name: GitHub release
    needs: [pypi, ghcr]
    # still release when the PyPI job is switched off (skipped), never when it failed
    if: ${{ !cancelled() && needs.ghcr.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.pypi.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # the release may already exist (e.g. created by hand to attach model archives): then just add the dists
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          fi
