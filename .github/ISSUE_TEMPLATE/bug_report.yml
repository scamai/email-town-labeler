name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Anyone can read it, and search engines index it. Do not paste
        real email content: no subjects, senders, addresses (your own account address
        included), snippets, bodies, message ids from your mailbox, screenshots of your inbox,
        `token.json` or `client_secret.json`. Describe the *shape* of a message instead
        ("HTML-only newsletter with a List-Id header").

        **A security or privacy problem goes to us privately, not here.** Use **Report a
        vulnerability** on this repository's Security tab
        (<https://github.com/scamai/email-town-labeler/security/advisories/new>), or email
        contact@scam.ai with the subject line `[SECURITY][Email Town]`. For a bug you cannot
        describe without private details, email contact@scam.ai with the subject line
        `[Email Town]`. Even in private, never send real mail, `token.json` or
        `client_secret.json`: we never look at the content of your mail.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real email content, addresses, message ids, tokens or client secrets.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran. Use synthetic examples for any mail involved.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `email-town-labeler --version` and `email-town-labeler doctor --redact`
      description: >-
        `--redact` masks email addresses (your account address included) as `<email>` and your
        home directory as `~`. Plain `doctor` prints both. Read the output before pasting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [pipx, pip / venv, uv, Docker, from source]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: macOS 15.1, Python 3.12.7
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model ref and backend
      placeholder: rules
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: >-
        Log lines carry Gmail message ids, and with `-vv` also tracebacks with file paths. Before
        pasting, replace each message id with `<id>` and your home directory with `~`, and remove
        anything else that points at your mailbox. Optional.
      render: text
